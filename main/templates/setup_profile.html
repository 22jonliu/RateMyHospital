<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Profile - RateMyHospital</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(26,86,219,0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(26,86,219,0.06) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -200px;
            right: -200px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(26,86,219,0.10) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.10);
            width: 100%;
            max-width: 420px;
            padding: 48px 40px 40px;
            position: relative;
            z-index: 1;
            animation: slideUp 0.5s cubic-bezier(.22,1,.36,1) both;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: #1a56db;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .logo-text {
            font-family: 'DM Serif Display', serif;
            font-size: 1.2rem;
            color: #111;
        }

        .logo-text span { color: #1a56db; }

        h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 2rem;
            color: #111;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 0.95rem;
            margin-bottom: 32px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            color: #111;
            background: white;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #1a56db;
            box-shadow: 0 0 0 3px rgba(26,86,219,0.10);
        }

        input::placeholder { color: #9ca3af; }

        .btn {
            width: 100%;
            padding: 13px;
            background: #1a56db;
            color: white;
            border: none;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:hover { background: #1040b0; }
        .btn:active { transform: scale(0.98); }

        .note {
            text-align: center;
            margin-top: 16px;
            color: #9ca3af;
            font-size: 0.82rem;
        }

        .skip {
            text-align: center;
            margin-top: 12px;
        }

        .skip a {
            color: #6b7280;
            font-size: 0.875rem;
            text-decoration: none;
        }

        .skip a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <div class="logo-icon">R</div>
            <div class="logo-text">Rate<span>My</span>Hospital</div>
        </div>

        <h1>Welcome, {{ request.user.username }}!</h1>
        <p class="subtitle">Tell us about yourself before you start reviewing.</p>

        <form method="POST" action="{% url 'RateMyHospital:setup_profile' %}">
            {% csrf_token %}

            <div class="field">
                <label for="job_title">Job title / occupation</label>
                <input type="text" name="job_title" id="job_title"
                    placeholder="e.g. Registered Nurse"
                    value="{{ profile.job_title|default:'' }}" required>
            </div>

            <div class="field">
                <label for="years_of_experience">Years of experience</label>
                <input type="text" name="years_of_experience" id="years_of_experience"
                    placeholder="e.g. 5 years"
                    value="{{ profile.years_of_experience|default:'' }}" required>
            </div>

            <button type="submit" class="btn">Save & Continue</button>
        </form>

        <p class="note">This info will appear on your reviews automatically</p>

        <div class="skip">
            <a href="{% url 'RateMyHospital:home' %}">Skip for now</a>
        </div>
    </div>
</body>
</html>
